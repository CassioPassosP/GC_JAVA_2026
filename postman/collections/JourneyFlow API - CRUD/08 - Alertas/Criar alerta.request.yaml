$kind: http-request
url: "{{baseUrl}}/alert"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reportId": {{reportId}},
      "assignedTo": {{managerId}},
      "storeId": {{storeId}},
      "destination": "MANAGER",
      "suggestion": "Entrar em contato com o colaborador.",
      "urgency": "TODAY",
      "status": "OPEN",
      "reminderSent": false,
      "answeredAt": null,
      "alertDate": "2026-10-30T09:30:00",
      "alertTitle": "Alerta de teste",
      "confirmed": false,
      "subtitle": "Criado pela collection do Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const payload = pm.response.json(); if (payload.id !== undefined) { pm.collectionVariables.set('alertId', String(payload.id)); } }
    language: text/javascript
order: 1000
