$kind: http-request
url: "{{baseUrl}}/pills/{{pillId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "title": "Segurança no Trabalho Atualizada",
        "content": "Conteúdo atualizado sobre segurança.",
        "quizQuestion": "Qual equipamento protege os olhos?",
        "quizOptions": "[\"Óculos de proteção\", \"Capacete\", \"Luvas\"]",
        "quizCorrect": 0,
        "dayFrom": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
