$kind: http-request
url: "{{baseUrl}}/reports/{{reportId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "{{employeeId}}",
      "originalText": "Mensagem original atualizada.",
      "editedText": "Mensagem revisada atualizada.",
      "summary": "Resumo atualizado",
      "topic": "Teste",
      "kind": "NEUTRAL",
      "source": "TEXT",
      "status": "ANALYZED",
      "helpRequest": false
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
