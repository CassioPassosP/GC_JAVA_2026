$kind: http-request
url: "{{baseUrl}}/reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "{{employeeId}}",
      "originalText": "Mensagem de teste enviada pelo Postman.",
      "editedText": "Mensagem revisada de teste enviada pelo Postman.",
      "summary": "Resumo de teste",
      "topic": "Teste",
      "kind": "NEUTRAL",
      "source": "TEXT",
      "helpRequest": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const payload = pm.response.json(); if (payload.id !== undefined) { pm.collectionVariables.set('reportId', String(payload.id)); } }
    language: text/javascript
order: 1000
