$kind: http-request
url: "{{baseUrl}}/pillprogress"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "{{employeeId}}",
      "pillId": {{pillId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
