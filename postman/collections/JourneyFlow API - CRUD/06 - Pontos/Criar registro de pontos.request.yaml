$kind: http-request
url: "{{baseUrl}}/points"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "employeeId": "{{employeeId}}",
        "points": 100,
        "reason": "Conclusão de desafio"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const payload = pm.response.json(); if (payload.id !== undefined) { pm.collectionVariables.set('pointsId', String(payload.id)); } }
    language: text/javascript
order: 1000
