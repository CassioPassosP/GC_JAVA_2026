$kind: http-request
url: "{{baseUrl}}/points/{{pointsId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": {{pointsId}},
      "employeeId": "{{employeeId}}",
      "reason": "Conclusão de desafio",
      "points": 15
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
