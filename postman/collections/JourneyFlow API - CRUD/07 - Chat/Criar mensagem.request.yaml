$kind: http-request
url: "{{baseUrl}}/chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "{{employeeId}}",
      "sender": "USER",
      "content": "Mensagem de teste via Postman",
      "source": "TEXT",
      "author": "POSTMAN",
      "dateSent": "2026-10-30T15:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const payload = pm.response.json(); if (payload.id !== undefined) { pm.collectionVariables.set('chatId', String(payload.id)); } }
    language: text/javascript
order: 1000
