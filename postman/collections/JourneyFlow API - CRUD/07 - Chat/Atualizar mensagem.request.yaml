$kind: http-request
url: "{{baseUrl}}/chat/{{chatId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "employeeId": "{{employeeId}}",
      "sender": "BOT",
      "content": "Resposta de teste atualizada via Postman",
      "source": "TEXT",
      "author": "POSTMAN",
      "dateSent": "2026-10-30T15:01:00Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
