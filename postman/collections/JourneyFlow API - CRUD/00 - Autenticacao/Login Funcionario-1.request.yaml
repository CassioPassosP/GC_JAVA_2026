$kind: http-request
name: Login Funcionario
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin2@email.com",
      "password": "12345678"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login realizado com sucesso", function () {
          pm.response.to.have.status(403);
      });
order: 4000
