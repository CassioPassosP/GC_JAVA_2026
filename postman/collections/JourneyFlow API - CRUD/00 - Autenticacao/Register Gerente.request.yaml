$kind: http-request
description: Requisição preparada para POST /auth/register. O backend precisa implementar esse endpoint e aceitar os campos deste exemplo. Ajuste o body para corresponder ao RegisterRequestDto. storeId deve referenciar uma loja existente. Se o cadastro não retornar JWT, execute Login em seguida.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "storeId": {{storeId}},
      "name": "Usuario RH",
      "email": "adminrh4@email.com",
      "password": "12345678",
      "role": "RH"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cadastro realizado (HTTP 201 ou 200)', function () {
          pm.expect([200, 201]).to.include(pm.response.code);
      });
      if (pm.response.code >= 200 && pm.response.code < 300) {
          let payload = {};
          try { payload = pm.response.json(); } catch (e) {}
          if (payload.token) pm.collectionVariables.set('token', payload.token);
          if (payload.userId !== undefined) pm.collectionVariables.set('authenticatedUserId', String(payload.userId));
          if (payload.role) pm.collectionVariables.set('authenticatedUserRole', payload.role);
      }
    language: text/javascript
order: 1000
