$kind: http-request
url: "{{baseUrl}}/store"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "storeName": "Loja Postman JourneyFlow",
      "creationDate": "2026-10-30T12:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code >= 200 && pm.response.code < 300) { const payload = pm.response.json(); if (payload.id !== undefined) { pm.collectionVariables.set('storeId', String(payload.id)); } }
    language: text/javascript
order: 1000
